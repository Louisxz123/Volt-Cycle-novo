<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — VoltCycle</title>
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="login.css">
</head>
<body>
<main class="auth-page">
  <div class="auth-card">
    <a href="index.html" class="brand auth-brand">
      <span class="brand-mark">V</span>
      <span class="brand-name">VoltCycle</span>
    </a>
    <p class="auth-tagline">Energia inteligente para sua jornada</p>

    <div class="card auth-form-card">
      <h1>Entrar</h1>
      <form id="loginForm" novalidate>
        <div class="field" id="emailField">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" required>
          <span class="error">Informe um e-mail válido.</span>
        </div>

        <div class="field" id="passwordField">
          <label for="password">Senha</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required minlength="6">
            <button type="button" class="toggle-visibility" data-target="password" aria-label="Mostrar senha">👁</button>
          </div>
          <span class="error">A senha deve ter pelo menos 6 caracteres.</span>
        </div>

        <div class="auth-row">
          <button type="button" class="link-btn" id="forgotBtn">Esqueci minha senha</button>
        </div>

        <button type="submit" class="btn btn-primary btn-block mt-16">Entrar</button>
      </form>
    </div>

    <p class="auth-footer-link">Não tem uma conta? <a href="cadastre-se.html">Cadastre-se</a></p>
  </div>
</main>

<script src="shared/main.js"></script>
<script src="login.js"></script>
</body>
</html>
