<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastre-se — VoltCycle</title>
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="login.css">
<link rel="stylesheet" href="cadastre-se.css">
</head>
<body>
<main class="auth-page">
  <div class="auth-card">
    <a href="index.html" class="brand auth-brand">
      <span class="brand-mark">V</span>
      <span class="brand-name">VoltCycle</span>
    </a>
    <p class="auth-tagline">Energia inteligente para sua jornada</p>

    <div class="card auth-form-card">
      <h1>Criar conta</h1>
      <form id="signupForm" novalidate>
        <div class="field" id="nameField">
          <label for="name">Nome completo</label>
          <input type="text" id="name" name="name" placeholder="Seu nome completo" autocomplete="name" required>
          <span class="error">Informe seu nome completo.</span>
        </div>

        <div class="field" id="emailField">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" required>
          <span class="error">Informe um e-mail válido.</span>
        </div>

        <div class="field" id="passwordField">
          <label for="password">Senha</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="new-password" required minlength="6">
            <button type="button" class="toggle-visibility" data-target="password" aria-label="Mostrar senha">👁</button>
          </div>
          <span class="error">A senha deve ter pelo menos 6 caracteres.</span>
          <div class="password-strength"><div class="password-strength-fill" id="strengthFill"></div></div>
        </div>

        <div class="field" id="confirmField">
          <label for="confirmPassword">Confirmar senha</label>
          <div class="input-wrap">
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" autocomplete="new-password" required>
            <button type="button" class="toggle-visibility" data-target="confirmPassword" aria-label="Mostrar senha">👁</button>
          </div>
          <span class="error">As senhas não coincidem.</span>
        </div>

        <button type="submit" class="btn btn-primary btn-block mt-16">Cadastrar</button>
      </form>
    </div>

    <p class="auth-footer-link">Já tem uma conta? <a href="login.html">Login</a></p>
  </div>
</main>

<script src="shared/main.js"></script>
<script src="cadastre-se.js"></script>
</body>
</html>
